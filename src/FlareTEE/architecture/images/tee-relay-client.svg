<svg width="560" height="600" viewBox="0 0 560 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .heading { fill: #595959; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
    .subtext { fill: #595959; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; }
    .label { fill: #c10f45; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; }
    .box { fill: none; stroke: #c10f45; stroke-width: 2; }
    .nested-box { fill: none; stroke: #c10f45; stroke-width: 1.5; }
    .connector { stroke: #c10f45; stroke-width: 1.2; fill: none; }
    .arrowhead { fill: #c10f45; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrowhead" />
    </marker>
  </defs>

  <!-- C-Chain Indexer Database -->
  <rect x="100" y="10" width="340" height="42" rx="4" class="box" />
  <text x="270" y="30" text-anchor="middle" class="heading">C-Chain Indexer Database (MySQL)</text>
  <text x="270" y="45" text-anchor="middle" class="subtext">TeeInstructionsSent events</text>

  <!-- Arrow: 40px -->
  <path d="M270 52 V92" class="connector" marker-end="url(#arrow)" />

  <!-- Collector -->
  <rect x="130" y="92" width="280" height="42" rx="4" class="box" />
  <text x="270" y="112" text-anchor="middle" class="heading">Collector</text>
  <text x="270" y="127" text-anchor="middle" class="subtext">Polls DB every 2s  |  Filters by event sig</text>

  <!-- Arrow: 45px, label beside -->
  <path d="M270 134 V179" class="connector" marker-end="url(#arrow)" />
  <text x="280" y="160" class="label">cToR channel</text>

  <!-- Router outer box: contains Filterer, Classify, Signer -->
  <rect x="100" y="179" width="340" height="185" rx="4" class="box" />
  <text x="270" y="200" text-anchor="middle" class="heading">Router</text>

  <!-- Filterer nested: 20px inner padding, centered -->
  <rect x="125" y="210" width="290" height="28" rx="4" class="nested-box" />
  <text x="270" y="229" text-anchor="middle" class="subtext">Filterer (Provider mode | Cosigner mode)</text>

  <!-- Arrow: 25px (branch is short but between nested elements = ok) -->
  <path d="M270 238 V258" class="connector" marker-end="url(#arrow)" />

  <!-- Classify & Route nested -->
  <rect x="125" y="258" width="290" height="42" rx="4" class="nested-box" />
  <text x="270" y="278" text-anchor="middle" class="heading">Classify &amp; Route</text>
  <text x="270" y="293" text-anchor="middle" class="subtext">Plain → Base  |  FDC2 → FDC  |  Backup → Backup</text>

  <!-- Signer nested: centered within Router (Router center = 270) -->
  <rect x="210" y="318" width="120" height="32" rx="4" class="nested-box" />
  <text x="270" y="339" text-anchor="middle" class="subtext">Signer (Local | Remote)</text>

  <!-- Arrow from Router bottom: 45px -->
  <path d="M270 364 V409" class="connector" marker-end="url(#arrow)" />
  <text x="280" y="390" class="label">rToS channel</text>

  <!-- Sender -->
  <rect x="130" y="409" width="280" height="42" rx="4" class="box" />
  <text x="270" y="429" text-anchor="middle" class="heading">Sender</text>
  <text x="270" y="444" text-anchor="middle" class="subtext">POST /instruction to each TEE proxy</text>

  <!-- Arrow: 45px -->
  <path d="M270 451 V496" class="connector" marker-end="url(#arrow)" />

  <!-- TEE Proxies -->
  <rect x="160" y="496" width="220" height="32" rx="4" class="box" />
  <text x="270" y="517" text-anchor="middle" class="heading">TEE Proxies</text>

  <!-- Side: FDC Verifiers (left, arrow into Router at Classify level) -->
  <rect x="10" y="261" width="80" height="36" rx="4" class="box" />
  <text x="50" y="278" text-anchor="middle" class="heading">FDC</text>
  <text x="50" y="291" text-anchor="middle" class="heading">Verifiers</text>

  <!-- Horizontal arrow: 35px -->
  <path d="M90 279 V279 H125" class="connector" marker-end="url(#arrow)" />

  <!-- Side: Backup URLs (right, arrow into Router at Classify level) -->
  <rect x="470" y="261" width="80" height="36" rx="4" class="box" />
  <text x="510" y="278" text-anchor="middle" class="heading">Backup</text>
  <text x="510" y="291" text-anchor="middle" class="heading">URLs</text>

  <!-- Horizontal arrow: 35px -->
  <path d="M470 279 H415" class="connector" marker-end="url(#arrow)" />
</svg>
