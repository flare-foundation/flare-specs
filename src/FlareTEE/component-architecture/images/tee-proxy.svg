<svg width="620" height="740" viewBox="0 0 620 740" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .heading { fill: #595959; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
    .subtext { fill: #595959; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; }
    .label { fill: #c10f45; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; }
    .box { fill: none; stroke: #c10f45; stroke-width: 2; }
    .nested-box { fill: none; stroke: #c10f45; stroke-width: 1.5; }
    .connector { stroke: #c10f45; stroke-width: 1.2; fill: none; }
    .arrowhead { fill: #c10f45; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrowhead" />
    </marker>
  </defs>

  <!-- External Clients -->
  <rect x="110" y="10" width="400" height="30" rx="4" class="box" />
  <text x="310" y="31" text-anchor="middle" class="heading">External Clients (data providers, users)</text>

  <!-- Arrow: 40px -->
  <path d="M310 40 V80" class="connector" marker-end="url(#arrow)" />

  <!-- External Server -->
  <rect x="110" y="80" width="400" height="115" rx="4" class="box" />
  <text x="310" y="102" text-anchor="middle" class="heading">External Server (6662)</text>
  <text x="310" y="120" text-anchor="middle" class="subtext">POST /instruction</text>
  <text x="310" y="135" text-anchor="middle" class="subtext">GET /action/result/*</text>
  <text x="310" y="150" text-anchor="middle" class="subtext">GET /action/status/*</text>
  <text x="310" y="165" text-anchor="middle" class="subtext">GET /info, /wallet/*, /backup/*</text>
  <text x="310" y="180" text-anchor="middle" class="subtext">POST /direct (optional)</text>

  <!-- Arrow: 45px -->
  <path d="M310 195 V240" class="connector" marker-end="url(#arrow)" />

  <!-- Core Services boundary -->
  <rect x="30" y="240" width="560" height="250" rx="4" class="box" />
  <text x="55" y="262" class="heading">Core Services</text>

  <!-- Services row: centered within Core Services (outer x=30 w=560, center=310) -->
  <!-- Row total: 155+20+120+20+120 = 435, start at 310-217 = 93 -->
  <rect x="93" y="275" width="155" height="55" rx="4" class="nested-box" />
  <text x="170" y="297" text-anchor="middle" class="heading">Instruction Service</text>
  <text x="170" y="315" text-anchor="middle" class="subtext">(voting)</text>

  <rect x="268" y="275" width="120" height="55" rx="4" class="nested-box" />
  <text x="328" y="297" text-anchor="middle" class="heading">Policy Service</text>
  <text x="328" y="315" text-anchor="middle" class="subtext">(sync)</text>

  <rect x="408" y="275" width="120" height="55" rx="4" class="nested-box" />
  <text x="468" y="297" text-anchor="middle" class="heading">Info Service</text>
  <text x="468" y="315" text-anchor="middle" class="subtext">(periodic)</text>

  <!-- Arrows from services to queue: 35px -->
  <path d="M170 330 V365" class="connector" marker-end="url(#arrow)" />
  <path d="M328 330 V365" class="connector" marker-end="url(#arrow)" />
  <path d="M468 330 V365" class="connector" marker-end="url(#arrow)" />

  <!-- Action Queue: centered, same total width -->
  <rect x="93" y="365" width="435" height="32" rx="4" class="nested-box" />
  <text x="310" y="386" text-anchor="middle" class="heading">Action Queues (Redis): Main | Direct | Backup</text>

  <!-- Bottom services row: centered, total: 140+20+150+20+105 = 435 -->
  <rect x="93" y="417" width="140" height="42" rx="4" class="nested-box" />
  <text x="163" y="436" text-anchor="middle" class="heading">Result Service</text>
  <text x="163" y="452" text-anchor="middle" class="subtext">(Redis)</text>

  <rect x="253" y="417" width="150" height="42" rx="4" class="nested-box" />
  <text x="328" y="436" text-anchor="middle" class="heading">Wallet Service</text>
  <text x="328" y="452" text-anchor="middle" class="subtext">(cache + Redis)</text>

  <rect x="423" y="417" width="105" height="42" rx="4" class="nested-box" />
  <text x="475" y="436" text-anchor="middle" class="heading">Liveness</text>
  <text x="475" y="452" text-anchor="middle" class="subtext">Checks</text>

  <!-- Arrow from Core Services to Internal Server: 45px -->
  <path d="M310 490 V535" class="connector" marker-end="url(#arrow)" />

  <!-- Internal Server -->
  <rect x="110" y="535" width="400" height="80" rx="4" class="box" />
  <text x="310" y="557" text-anchor="middle" class="heading">Internal Server (6661)</text>
  <text x="310" y="575" text-anchor="middle" class="subtext">POST /queue/{queueID}</text>
  <text x="310" y="590" text-anchor="middle" class="subtext">POST /result</text>
  <text x="310" y="605" text-anchor="middle" class="subtext">GET /healthy, /startup, /ready</text>

  <!-- Arrow to TEE Node: 45px -->
  <path d="M310 615 V660" class="connector" marker-end="url(#arrow)" />

  <!-- TEE Node -->
  <rect x="150" y="660" width="320" height="45" rx="4" class="box" />
  <text x="310" y="682" text-anchor="middle" class="heading">TEE Node</text>
  <text x="310" y="698" text-anchor="middle" class="subtext">(polls queues, posts results)</text>
</svg>
